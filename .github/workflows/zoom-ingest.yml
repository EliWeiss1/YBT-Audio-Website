name: zoom-ingest

on:
  repository_dispatch:
    types: [zoom-ingest]

concurrency:
  group: zoom-ingest-${{ github.event.client_payload.lectureId }}

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shiurim-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shiurim-app/package-lock.json
      - run: npm ci
      # apt mirrors occasionally stall with no output; without a per-step timeout one
      # stalled step burns the whole 10-minute job budget and the job is cancelled
      # (not failed), so nothing is ingested. Cap each install and retry once.
      # `timeout` is applied per attempt inside the shell (a step-level timeout would
      # kill the step outright and the retry would never run). A slow mirror
      # (observed: 48 kB/s, 8.5 min for 25 MB) usually clears on the next attempt.
      - name: Install Playwright chromium
        timeout-minutes: 6
        run: |
          for i in 1 2 3; do
            timeout 110 npx playwright install --with-deps chromium && exit 0
            echo "attempt $i failed or timed out, retrying"
          done
          exit 1
      # ffmpeg concatenates multi-recording "merge" clips. It is NOT on the
      # ubuntu-latest image (only Playwright's bundled copy, which isn't on PATH),
      # so install it explicitly. Harmless for the separate/pick/single paths,
      # which never invoke it.
      - name: Install ffmpeg (for merging multi-part recordings)
        if: github.event.client_payload.recordings.mode == 'merge'
        timeout-minutes: 3
        run: sudo apt-get install -y ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node scripts/zoom-browser-ingest.mjs
        env:
          SHARE_URL: ${{ github.event.client_payload.shareUrl }}
          LECTURE_ID: ${{ github.event.client_payload.lectureId }}
          TITLE: ${{ github.event.client_payload.title }}
          RABBI: ${{ github.event.client_payload.rabbi }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          DATE: ${{ github.event.client_payload.date }}
          SENDER_EMAIL: ${{ github.event.client_payload.senderEmail }}
          RAW_EMAIL_SNIPPET: ${{ github.event.client_payload.rawEmailSnippet }}
          RECORDINGS_JSON: ${{ toJSON(github.event.client_payload.recordings) }}
          INGEST_COMPLETE_URL: https://ybtshiurim.org/api/ingest-complete
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          DRY_RUN: ${{ vars.INGEST_DRY_RUN }}

      # Safety net: if the job fails BEFORE the worker could self-report (e.g. npm ci
      # or `playwright install` failed, or the runner died), notify the admin anyway.
      # The `.ingest-reported` marker means the worker already sent an email, so we
      # skip to avoid a duplicate.
      - name: Notify admin on infrastructure failure
        if: (failure() || cancelled()) && hashFiles('shiurim-app/.ingest-reported') == ''
        run: |
          curl -sS -X POST "$INGEST_COMPLETE_URL" \
            -H "Content-Type: application/json" \
            -H "x-ingest-secret: $INGEST_SECRET" \
            -d "$(jq -n \
              --arg id "$LECTURE_ID" --arg t "$TITLE" --arg r "$RABBI" --arg u "$SHARE_URL" --arg s "$RAW_EMAIL_SNIPPET" \
              '{lectureId:$id,title:$t,rabbi:$r,shareUrl:$u,rawEmailSnippet:$s,error:"github_action_job_failed"}')"
        env:
          INGEST_COMPLETE_URL: https://ybtshiurim.org/api/ingest-complete
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          LECTURE_ID: ${{ github.event.client_payload.lectureId }}
          TITLE: ${{ github.event.client_payload.title }}
          RABBI: ${{ github.event.client_payload.rabbi }}
          SHARE_URL: ${{ github.event.client_payload.shareUrl }}
          RAW_EMAIL_SNIPPET: ${{ github.event.client_payload.rawEmailSnippet }}
