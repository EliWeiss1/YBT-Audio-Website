name: dropbox-ingest

on:
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC (1h after drive-ingest, to avoid a deploy collision)
  workflow_dispatch:
    inputs:
      max:
        description: 'Max files to ingest this run (blank = no cap)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shiurim-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shiurim-app/package-lock.json
      - run: npm ci
      # ffmpeg transcodes the Dropbox recordings to .mp3. Not on ubuntu-latest by
      # default, so install it explicitly (same as the other ingest workflows).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Sync new Dropbox recordings (dropbox_ingest_log skips already-ingested files)
        run: node scripts/dropbox-sync.mjs ${{ github.event.inputs.max && format('--max {0}', github.event.inputs.max) || '' }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_SHARE_LINK: ${{ secrets.DROPBOX_SHARE_LINK }}
          INGEST_COMPLETE_URL: https://ybtshiurim.org/api/ingest-complete
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          INGEST_DRY_RUN: ${{ vars.INGEST_DRY_RUN }}
